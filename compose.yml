services:
  app:
    environment:
      PHP_IDE_CONFIG: serverName=test_app
      XDEBUG_MODE: ${XDEBUG_MODE:-off}
      HOME: /tmp
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /var/www/html
    volumes:
      - ./app:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network

  nginx:
    image: nginx:latest
    ports:
      - "8080:80"
    volumes:
      - ./app:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - app-network

  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: test_app
      POSTGRES_USER: test_app
      POSTGRES_PASSWORD: test_app
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "test_app", "-d", "test_app"]
      interval: 2s
      retries: 15
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge